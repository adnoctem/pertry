name: Release

# Releasing is a manual, gated act, which is the convention the sibling repositories follow:
# `PERTRY_RELEASE_ENABLED` has to be set to `true` in the repository's Actions variables, and
# somebody has to dispatch this workflow. Testing can hand it the commit it tested, and the gate
# below refuses a branch that has moved on since.
#
# Two applications, one monorepo, one version. A release publishes one tarball per application
# per platform, plus a checksum file, as GitHub release assets - all stamped with the same
# version.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Optional tested commit; must still be the selected branch head
        required: false
        type: string
      bootstrap:
        description: Publish the first 0.1.0 release from main (requires no existing version tags)
        required: false
        default: false
        type: boolean

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: pertry-release
  # Never cancelled. A half-cancelled release is a tag with no assets.
  cancel-in-progress: false

jobs:
  release:
    name: Prepare and publish the release
    if: ${{ vars.PERTRY_RELEASE_ENABLED == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag, the release and the changelog commit
      issues: write # semantic-release comments on a failed release
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The release script stamps artifacts with the version, and semantic-release needs the
          # history and tags to decide what that version is. Without this every release would
          # start over from zero.
          fetch-depth: 0

      - name: Check release inputs
        env:
          TESTED_SHA: ${{ inputs.sha }}
          BOOTSTRAP_RELEASE: ${{ inputs.bootstrap }}
        run: |
          if [[ -n "${TESTED_SHA}" && "${TESTED_SHA}" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::The branch has advanced since testing. Run Testing again before releasing." >&2
            exit 1
          fi

          if [[ "${BOOTSTRAP_RELEASE}" == "true" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "::error::The first 0.1.0 release must come from main." >&2
              exit 1
            fi

            if [[ -n "$(git tag --list 'v*')" ]]; then
              echo "::error::Version tags already exist. Use semantic-release, or recover a partial release by hand." >&2
              exit 1
            fi
          fi

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      # scripts/release-create.sh is a libsh consumer, so the library has to be on the machine
      # before it runs. Installed rather than vendored, and pinned rather than tracking main:
      # libsh is 0.x and says outright that it ships breaking changes without a major bump, so an
      # unpinned install would let an upstream release break a release here.
      - name: Set up libsh
        env:
          # renovate: datasource=github-releases depName=adnoctem/libsh
          LIBSH_VERSION: 0.7.0
        run: |
          # The installer is fetched from the pinned tag rather than from main, so the script
          # that runs and the library it installs are the same reviewed revision.
          curl -fsSL "https://raw.githubusercontent.com/adnoctem/libsh/v${LIBSH_VERSION}/bin/install" |
            bash -s -- --version "v${LIBSH_VERSION}"

          # libman is on PATH only from the next step onwards, so this one calls it by path to
          # ask where it put the library.
          echo "${HOME}/.local/bin" >>"${GITHUB_PATH}"
          echo "LIBSH_DIR=$("${HOME}/.local/bin/libman" path)" >>"${GITHUB_ENV}"

      # The first release cannot come from semantic-release: with no version tag to compare
      # against it proposes 1.0.0, which the 0.x policy in the release script refuses. This path
      # builds and publishes exactly 0.1.0 and creates the tag every later release is measured
      # from.
      - name: Publish the initial 0.1.0 release
        if: inputs.bootstrap
        env:
          GH_TOKEN: ${{ secrets.ANC_GITHUB_TOKEN || github.token }}
        run: |
          scripts/release-create.sh --version 0.1.0

          gh release create v0.1.0 \
            --target "${GITHUB_SHA}" \
            --title v0.1.0 \
            --generate-notes \
            dist/*.tar.gz dist/CHECKSUMS_SHA256.txt

      - name: Prepare and publish the release
        if: ${{ !inputs.bootstrap }}
        uses: cycjimmy/semantic-release-action@1989a0fefc4aea321e07f717680ed8e345925dc1 # v7.1.2
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.ANC_GITHUB_TOKEN || github.token }}
        with:
          semantic_version: 25
          branches: |
            [
              'main',
              'next'
            ]
          extra_plugins: |
            @semantic-release/changelog@6.0.3
            @semantic-release/exec@7.0.3
            @semantic-release/git@10.0.1
            conventional-changelog-conventionalcommits@8.0.0

      # One place for the two paths to agree on what happened, so reading the run does not mean
      # working out which one took it.
      - name: Report what was released
        if: always()
        env:
          BOOTSTRAP_RELEASE: ${{ inputs.bootstrap }}
          SEMANTIC_PUBLISHED: ${{ steps.semantic.outputs.new_release_published }}
          SEMANTIC_VERSION: ${{ steps.semantic.outputs.new_release_version }}
        run: |
          if [[ "${BOOTSTRAP_RELEASE}" == "true" ]]; then
            published=true
            version=0.1.0
          else
            published="${SEMANTIC_PUBLISHED:-false}"
            version="${SEMANTIC_VERSION:-}"
          fi

          echo "Released: published=${published} version=${version:-none}"
          echo "- published: \`${published}\`" >>"${GITHUB_STEP_SUMMARY}"
          echo "- version: \`${version:-none}\`" >>"${GITHUB_STEP_SUMMARY}"

      # Publishing is not transactional: the tag and the release assets cannot both land or both
      # fail together. Keeping what was built - including when the run failed - is what makes a
      # partial release recoverable without rebuilding, which would produce different bytes under
      # a version somebody may already have downloaded.
      - name: Retain the prepared release for inspection or retry
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prepared-release-${{ github.run_id }}
          path: |
            dist/**
          if-no-files-found: warn
          retention-days: 14
